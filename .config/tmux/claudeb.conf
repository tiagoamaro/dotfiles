# Loaded only on the claudeb socket (tmux -L claudeb), so ctrl+a never leaks into other tmux servers.
set -g escape-time 0
set -g mouse on
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-set-title off
set -g status-left '#[bold]#{pane_title} #[default]'
set -g status-left-length 20
set -g status-right 'ctrl+a swap · ctrl+b z split'
set -g window-status-format ''
set -g window-status-current-format ''

# ctrl+a swaps panes and keeps the zoom, so each session fills the screen.
bind -n C-a last-pane -Z
